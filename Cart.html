<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gada Electronics | Cart</title>
  <style>
    :root { --brand:#0f6efb; --text:#1a1a1a; --muted:#6b7280; --bg:#f7f7fb; --card:#ffffff; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, "Noto Sans", sans-serif; color:var(--text); background:var(--bg); }
    .container { width: min(1100px, 92%); margin: 0 auto; }
    .site-header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border); z-index: 50; }
    .header-wrap { display:flex; align-items:center; justify-content:space-between; padding:12px 0; }
    .brand { font-weight:700; font-size:1.2rem; color:var(--brand); text-decoration:none; }
    .nav a { margin:0 10px; color:var(--text); text-decoration:none; padding:6px 10px; border-radius:6px; }
    .nav a:hover { background: var(--bg); }
    .logo-header 
    { font-weight:700; font-size:1.5rem; color:var(--brand); text-decoration:none; display:flex; align-items:center; justify-content:space-between; padding:12px 0; } 
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); }
    th, td { border-bottom: 1px solid var(--border); padding: 12px; text-align: left; }
    th { background: #f9fafb; }
    .footer { margin-top:40px; border-top:1px solid var(--border); background:#fff; }
    .footer .wrap { padding: 18px 0; color: #6b7280; text-align:center; }
    .btn { display:inline-block; background:var(--brand); color:#fff; padding:10px 16px; border-radius:8px; text-decoration:none; font-weight:600; }
    .btn.secondary { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  </style>
</head>
<body>
  <header class="logo-header">
    GADA ELECTRONICS
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="signin.html">Sign In</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Your Cart</h1>

    <div class="card" style="padding:0; overflow:hidden;">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Smartphone X (128 GB)</td>
            <td>₹29,999</td>
            <td>1</td>
            <td>₹29,999</td>
          </tr>
          <tr>
            <td>Noise-Cancel Headphones</td>
            <td>₹4,499</td>
            <td>1</td>
            <td>₹4,499</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card" style="margin-top:16px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <div>
        <p><strong>Total:</strong> ₹34,498</p>
        <p class="muted" style="margin-top:-6px;">Taxes & shipping calculated at checkout.</p>
      </div>
      <div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container wrap">© 2025 Gada Electronics. All rights reserved.</div>
  </footer>
</body>
</html>
