<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gada Electronics | Sign Up</title>
  <style>
    :root { --brand:#0f6efb; --text:#1a1a1a; --muted:#6b7280; --bg:#f7f7fb; --card:#ffffff; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, "Noto Sans", sans-serif; color:var(--text); background:var(--bg); }
    .container { width: min(1100px, 92%); margin: 0 auto; }
    .site-header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border); z-index: 50; }
    .header-wrap { display:flex; align-items:center; justify-content:space-between; padding:12px 0; }
    .brand { font-weight:700; font-size:1.2rem; color:var(--brand); text-decoration:none; }
    .nav a { margin:0 10px; color:var(--text); text-decoration:none; padding:6px 10px; border-radius:6px; }
    .nav a:hover { background: var(--bg); }
    .logo-header 
    { font-weight:700; font-size:1.5rem; color:var(--brand); text-decoration:none; display:flex; align-items:center; justify-content:space-between; padding:12px 0; }

    form { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
    .form-actions { margin-top: 16px; display: flex; gap: 12px; }
    .btn { display:inline-block; background:var(--brand); color:#fff; padding:10px 16px; border-radius:8px; text-decoration:none; font-weight:600; }
    .btn.secondary { background:#fff; color:var(--brand); border:1px solid var(--brand); }
    .footer { margin-top:40px; border-top:1px solid var(--border); background:#fff; }
    .footer .wrap { padding: 18px 0; color: #6b7280; text-align:center; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <header class="logo-header">
    GADA ELECTRONICS
    <div class="container header-wrap">
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="signin.html">Sign In</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Create your account</h1>
    <p class="muted">Join Gada Electronics to track orders and save your cart.</p>

    <form>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" placeholder="9876543210" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required />

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required />

      <div style="margin-top:10px;">
        <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
          <input type="checkbox" name="terms" required /> I agree to the Terms & Privacy Policy
        </label>
      </div>

      <div class="form-actions">
        <button onclick="location.href='index.html'" class="btn">Sign Up</button>
        <a href="signin.html">Already have an account?</a>
      </div>
    </form>
  </main>

  <footer class="footer">
    <div class="container wrap">© 2025 Gada Electronics. All rights reserved.</div>
  </footer>
</body>
</html>
